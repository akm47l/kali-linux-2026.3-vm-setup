# Debian Installer template for a NEW, dedicated VM disk only.
# This file is not automatically passed to the installer by ./kali.sh install.
# Disk selection and partition-write confirmation remain interactive by design.
# Never use an automated partition recipe against a disk containing data.
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/hostname string kali-vm
d-i netcfg/get_domain string local
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali
d-i mirror/http/proxy string
d-i passwd/user-fullname string Kali User
d-i passwd/username string kali
# No password or password hash is stored here; set one interactively.
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Aden
d-i clock-setup/ntp boolean true
# These describe a basic layout, but choosing/formatting a target remains interactive.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
# Select Kali tasks from the installer UI; task names vary between image/release builds.
tasksel tasksel/first multiselect standard
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
# Do not preselect a boot disk; keep the installer's device selection visible.
d-i finish-install/reboot_in_progress note
