name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck qemu-system-x86 qemu-utils
      - name: Bash syntax
        run: |
          find . -path './.git' -prune -o -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: ShellCheck
        run: shellcheck -x -P scripts kali.sh start-kali.sh scripts/*.sh scripts/lib/*.sh tests/*.sh installer/*.sh security/*.sh
      - name: Unit and security tests
        run: |
          bash tests/test-config.sh
          bash tests/test-security.sh
          bash tests/test-storage.sh
      - name: QEMU integration test (TCG, no Kali ISO)
        run: bash tests/test-startup.sh
      - name: Repository artifact and documentation checks
        run: python3 tests/test-repository.py
